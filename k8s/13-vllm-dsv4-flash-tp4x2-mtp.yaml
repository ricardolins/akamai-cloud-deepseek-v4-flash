# vLLM serving deepseek-ai/DeepSeek-V4-Flash (284B MoE, 13B active, FP4 experts + FP8 rest)
# 2x TP=4 (best layout so far) + MTP speculative decoding: the model ships 1 multi-token-prediction layer that drafts
# the next token; the main model verifies it in the same forward pass.
# Compare with 12-vllm-dsv4-flash-tp4x2.yaml (same layout, no MTP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv4-flash
  namespace: llm-bench
  labels: {app: dsv4-flash}
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: dsv4-flash}
  template:
    metadata:
      labels: {app: dsv4-flash}
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.32.0
        args:
        - deepseek-ai/DeepSeek-V4-Flash
        - --served-model-name=deepseek-v4-flash
        - --tensor-parallel-size=4          # each replica splits the model across 4 GPUs
        - --max-model-len=1048576           # the model's native 1M-token window
        - --kv-cache-dtype=fp8
        - --tokenizer-mode=deepseek_v4
        - --reasoning-parser=deepseek_v4
        - --gpu-memory-utilization=0.90
        - --no-enable-prefix-caching        # every benchmark prompt must be prefilled for real
        - --speculative-config={"method":"mtp","num_speculative_tokens":1}
        - --port=8000
        env:
        - {name: HF_HOME, value: /models/hf}
        - {name: HF_HUB_OFFLINE, value: "1"}  # weights were pre-downloaded by the Job in 05-download-model.yaml
        - {name: VLLM_LOGGING_LEVEL, value: INFO}
        ports:
        - {containerPort: 8000, name: http}
        resources:
          limits: {nvidia.com/gpu: 4}
          requests: {nvidia.com/gpu: 4, cpu: "16", memory: 192Gi}
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:                       # loading 160 GB + kernel JIT + CUDA graph capture
          httpGet: {path: /health, port: 8000}
          periodSeconds: 15
          failureThreshold: 240             # up to 60 min
        volumeMounts:
        - {name: models, mountPath: /models}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: models                        # local disk of the GPU node; survives pod restarts
        hostPath: {path: /var/lib/llm-models, type: DirectoryOrCreate}
      - name: shm                           # NCCL needs a large /dev/shm for tensor parallelism
        emptyDir: {medium: Memory, sizeLimit: 64Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: dsv4-flash
  namespace: llm-bench
spec:
  selector: {app: dsv4-flash}
  ports:
  - {port: 8000, targetPort: http, name: http}
