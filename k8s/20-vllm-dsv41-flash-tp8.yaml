# vLLM serving deepseek-ai/DeepSeek-V4.1-Flash (552B backbone + 196B Engram memory, 8B active in prefill / 16B in decode,
# 510 GB checkpoint) with tensor parallelism across the 8 RTX PRO 6000 Blackwell GPUs of one node.
# 510 GB does not fit in 4 GPUs (384 GB), so TP=8 is the only single-replica layout on this node.
# vLLM keeps the Engram embedding tables in pinned CPU memory by default (EngramConfig.cpu_offload=True).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv41-flash
  namespace: llm-bench
  labels: {app: dsv41-flash}
spec:
  replicas: 1
  strategy: {type: Recreate}            # one copy takes all 8 GPUs
  selector:
    matchLabels: {app: dsv41-flash}
  template:
    metadata:
      labels: {app: dsv41-flash}
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.32.0
        args:
        - deepseek-ai/DeepSeek-V4.1-Flash
        - --served-model-name=deepseek-v4.1-flash
        - --tensor-parallel-size=8          # split every layer across the 8 GPUs
        - --max-model-len=1048576           # the model's native 1M-token window
        - --tokenizer-mode=deepseek_v41     # V4.1 prompt encoder (thinking, tools, reasoning effort)
        - --reasoning-parser=deepseek_v41
        - --tool-call-parser=deepseek_v41
        - --enable-auto-tool-choice
        - --gpu-memory-utilization=0.90
        - --no-enable-prefix-caching        # every benchmark prompt must be prefilled for real
        - --port=8000
        env:
        - {name: HF_HOME, value: /models/hf}
        - {name: HF_HUB_OFFLINE, value: "1"}  # weights were pre-downloaded by the Job in 05-download-model.yaml
        - {name: VLLM_LOGGING_LEVEL, value: INFO}
        ports:
        - {containerPort: 8000, name: http}
        resources:
          limits: {nvidia.com/gpu: 8}
          requests: {nvidia.com/gpu: 8, cpu: "32", memory: 512Gi}   # Engram tables live in host RAM
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:                       # loading 510 GB + kernel JIT + CUDA graph capture
          httpGet: {path: /health, port: 8000}
          periodSeconds: 15
          failureThreshold: 360             # up to 90 min
        volumeMounts:
        - {name: models, mountPath: /models}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: models                        # local disk of the GPU node; survives pod restarts
        hostPath: {path: /var/lib/llm-models, type: DirectoryOrCreate}
      - name: shm                           # NCCL needs a large /dev/shm for tensor parallelism
        emptyDir: {medium: Memory, sizeLimit: 64Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: dsv41-flash
  namespace: llm-bench
spec:
  selector: {app: dsv41-flash}
  ports:
  - {port: 8000, targetPort: http, name: http}
